    <!-- Global error handler to suppress external script errors -->
    <script>
      // Monkey-patch Element.prototype.matches to handle invalid selectors
      const originalMatches = Element.prototype.matches;
      Element.prototype.matches = function(selector) {
        try {
          return originalMatches.call(this, selector);
        } catch (e) {
          if (e.message && e.message.includes('Failed to execute')) {
            console.warn('Suppressed invalid selector error:', selector.substring(0, 50));
            return false;
          }
          throw e;
        }
      };

      // Also monkey-patch querySelector family
      const originalQuerySelectorAll = Element.prototype.querySelectorAll;
      Element.prototype.querySelectorAll = function(selector) {
        try {
          return originalQuerySelectorAll.call(this, selector);
        } catch (e) {
          if (e.message && e.message.includes('Failed to execute')) {
            console.warn('Suppressed invalid querySelectorAll:', selector.substring(0, 50));
            return [];
          }
          throw e;
        }
      };

      // Global error handler
      window.addEventListener('error', (event) => {
        if (event.filename && event.filename.includes('ca-wevets.js')) {
          if (event.message && event.message.includes('Failed to execute')) {
            console.warn('Suppressed ca-wevets.js error');
            event.preventDefault();
          }
        }
      }, true);

      // Capture all clicks globally (capturing phase)
      document.addEventListener('click', (event) => {
        const target = event.target as HTMLElement;
        if (target && target.id === 'btn-hero-contratar') {
          console.log('🔴 GLOBAL: Hero button clicked!');
        }
      }, true);
    </script>
    <!-- End Global error handler -->
